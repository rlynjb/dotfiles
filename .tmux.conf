# ===========================================
# Tmux Configuration (modernized)
# ===========================================

# ------------------------------------
# Prefix: Alt/Option + a (same as before)
# ------------------------------------
set -g prefix M-a
unbind C-b
bind M-a send-prefix

# ------------------------------------
# General settings
# ------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # True color support
set -g mouse on                                    # Enable mouse
set -g base-index 1                                # Start windows at 1
setw -g pane-base-index 1                          # Start panes at 1
set -g renumber-windows on                         # Renumber windows on close
set -g escape-time 0                               # No delay for escape key
set -g history-limit 50000                         # Bigger history
set -g extended-keys on                            # Pass through Shift+Enter, etc.
set -as terminal-features 'xterm*:extkeys'         # Tell tmux iTerm2 supports CSI u

# ------------------------------------
# Pane & window management (your keybinds preserved)
# ------------------------------------
unbind %
bind d split-window -h -c "#{pane_current_path}"   # Split right, keep directory
bind s split-window -v -c "#{pane_current_path}"   # Split below, keep directory
bind t new-window -c "#{pane_current_path}"         # New window, keep directory
bind e kill-pane
bind w kill-window

# Navigate windows
bind ] next-window
bind [ previous-window

# Resize panes (your vim-style keybinds preserved)
bind h resize-pane -L 10
bind l resize-pane -R 10
bind j resize-pane -D 10
bind k resize-pane -U 10

# Smart pane switching with Ctrl+hjkl (works with vim too)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# ------------------------------------
# Vi copy mode (FIXED: modern syntax)
# ------------------------------------
setw -g mode-keys vi
bind Escape copy-mode
unbind p
bind p paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ------------------------------------
# Activity
# ------------------------------------
setw -g monitor-activity off
set -g visual-activity off

# ------------------------------------
# Status bar (clean, minimal)
# ------------------------------------
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=white"
set -g status-left "#[fg=cyan,bold] #S "
set -g status-right "#[fg=yellow]%H:%M "
set -g status-left-length 30
setw -g window-status-format "  #I:#W#(git -C \"#{pane_current_path}\" status --porcelain 2>/dev/null | grep -q . && printf '*')#(pgrep -P #{pane_pid} -l 2>/dev/null | awk '{print $2}' | grep -qE '^(claude|codex|gemini|aider|cursor-agent|aichat)$' && printf '●')  "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#b4befe,bold]  #I:#W#(git -C \"#{pane_current_path}\" status --porcelain 2>/dev/null | grep -q . && printf '*')#(pgrep -P #{pane_pid} -l 2>/dev/null | awk '{print $2}' | grep -qE '^(claude|codex|gemini|aider|cursor-agent|aichat)$' && printf '●')  "

# ------------------------------------
# Pane borders
# ------------------------------------
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"

# ------------------------------------
# Plugins (managed by TPM)
# ------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect: also restore common dev processes (edit list as you like)
set -g @resurrect-processes 'vim nvim vi tail less more man git ssh node npm pnpm yarn python python3'
set -g @resurrect-capture-pane-contents 'on'   # save visible pane contents

# Continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Keep this line at the very bottom of the file
run '~/.tmux/plugins/tpm/tpm'
